name: Build DSH iOS IPA

on:
  workflow_dispatch: # 支持在 Actions 页面手动点击触发
  push:
    branches: [ main ]

jobs:
  build:
    # 强制使用 Apple Silicon (M1) 的 macOS 14 环境，确保兼容性
    runs-on: macos-14 
    # 设置超时时间，防止排队或网络卡死导致浪费资源
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install build dependencies
      run: |
        # 安装基础编译工具和 lld
        brew install meson ninja lld
        # 将 lld 加入环境变量，供 make 命令调用
        echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH
        # 安装 Xcode 工程管理工具
        gem install xcodeproj

    - name: Build emulator and rootfs
      run: |
        # 开启详细日志输出，如果有报错会清晰显示
        set -ex
        make emulator
        make rootfs

    - name: Build iOS App Archive
      run: |
        # 编译生成未签名的 .xcarchive
        xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release -destination 'generic/platform=iOS' -archivePath ./build/DSH.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Package Unsigned IPA
      run: |
        # 将 .app 提取到 Payload 文件夹并打包成 .ipa
        mkdir -p ./build/Payload
        cp -r ./build/DSH.xcarchive/Products/Applications/DSH.app ./build/Payload/
        cd ./build
        zip -r DSH-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSH-unsigned-ipa
        path: ./build/DSH-unsigned.ipa
