name: Build Unsigned DSHIOS IPA (macOS 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 确保拉取完整的子模块

      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      # --- 修复步骤：安装 libarchive 并设置环境变量 ---
      - name: Install Dependencies
        run: |
          brew install libarchive pkg-config meson ninja
          # 关键：让 pkg-config 能够找到 Homebrew 安装的 libarchive
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build Rootfs
        run: |
          # 先清理可能存在的旧构建目录，确保 meson 使用新的环境变量
          rm -rf ish-arm64/build-arm64-release
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
