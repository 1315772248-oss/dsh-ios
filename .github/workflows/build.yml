name: Build DSHIOS (macOS 15 & Node 22)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # 使用最新的 macOS 15 运行器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 明确指定使用 Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macOS-15 默认支持 Xcode 16，这里指定以确保兼容
          xcode-version: '16.0'

      - name: Install Dependencies
        run: |
          # 安装构建所需的所有 Homebrew 依赖，包括 lld
          brew install pkg-config libarchive meson ninja lld
          # 将 lld 加入 PATH，解决 ld.lld not found 的问题
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Build Rootfs
        run: |
          # 解决 fakefsify 找不到 libarchive 的问题
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          rm -rf ish-arm64/build-arm64-release
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
