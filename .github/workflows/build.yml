name: Build Unsigned DSHIOS IPA (macOS 15 Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Install Dependencies
        run: |
          brew install pkg-config libarchive meson ninja

      # 关键修复：直接在 make rootfs 时内联环境变量，并强制清理旧构建
      - name: Build Rootfs
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          echo "PKG_CONFIG_PATH is: $PKG_CONFIG_PATH"
          
          # 验证是否能找到 libarchive
          pkg-config --modversion libarchive
          
          # 强制彻底清理，避免 meson 缓存导致重新配置失败
          rm -rf ish-arm64/build-arm64-release
          
          # 执行 rootfs 构建
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
