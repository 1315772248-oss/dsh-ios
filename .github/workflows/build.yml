name: Build DSHIOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 如果必须指定 Node.js 22 环境
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies
        run: |
          brew install pkg-config libarchive meson ninja lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Build Rootfs
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          
          # 彻底清理可能残留的构建产物，避免架构混编或缓存污染
          rm -rf ish-arm64/build-arm64-release
          if [ -d "ish-arm64" ]; then
            cd ish-arm64 && make clean 2>/dev/null || true && cd ..
          fi

          # 显式关闭 JIT 防护页相关问题，若仍报错可尝试加环境变量
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
