name: Build DSHIOS (Intel Fallback)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # 强制使用 Intel 芯片运行器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0' # Intel 运行器通常最高支持 Xcode 15

      - name: Install Dependencies
        run: |
          brew install pkg-config libarchive meson ninja lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Build Rootfs
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          rm -rf ish-arm64/build-arm64-release
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
