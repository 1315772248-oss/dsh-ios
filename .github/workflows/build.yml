name: Build Unsigned DSHIOS IPA (macOS 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # 明确指定使用 macOS 15 运行器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macOS-15 镜像已包含 Xcode 26.3，符合 DSHIOS 对 Xcode 26/27 的要求
          xcode-version: '26.3'

      - name: Build Rootfs (DSHIOS 关键步骤)
        run: |
          # DSHIOS 需要先生成 Linux 根文件系统镜像
          make rootfs

      - name: Build and Archive (Unsigned)
        run: |
          # 在 macOS-15 上，CODE_SIGNING_ALLOWED=NO 即可完成未签名编译
          xcodebuild clean archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DSH.xcarchive/Products/Applications/DSH.app build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
